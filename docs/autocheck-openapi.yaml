# Проект контракта для согласования. Приложение пока не реализовано.
openapi: 3.0.3
info:
  title: Element Autocheck Service
  version: 1.0.0
  description: 'Проект, не реализованный API. Очередь принадлежит ЛК; сервис резервирует места, проверяет и доставляет
    результат. Полная семантика: autocheck-microservice-design.md.'
servers:
- url: https://autocheck.example.edu
  description: Проектный URL за TLS proxy.
security:
- bearerAuth: []
paths:
  /v1/reservations:
    post:
      operationId: createReservation
      summary: Зарезервировать одно место перед загрузкой
      x-required-scopes:
      - checks:write
      responses:
        '201':
          description: Место занято, TTL 120 секунд.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '200':
          description: Идемпотентный повтор, актуальное состояние исходной резервации.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '400':
          description: Некорректные параметры или JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт ключа, attempt или состояния.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Резервация, артефакт или event payload истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Невалидный manifest, хеш, multipart или настройка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Все слоты заняты.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: &id001
            Retry-After:
              description: Число секунд до повтора.
              schema:
                type: integer
                minimum: 1
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReservationRequest'
  /v1/reservations/{reservationId}:
    parameters:
    - $ref: '#/components/parameters/ReservationId'
    get:
      operationId: getReservation
      summary: Получить состояние своей резервации
      x-required-scopes:
      - checks:read
      responses:
        '200':
          description: Текущее состояние.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reservation'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс отсутствует или принадлежит другому клиенту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Резервация, артефакт или event payload истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
    delete:
      operationId: releaseReservation
      summary: Освободить reserved место
      x-required-scopes:
      - checks:write
      responses:
        '204':
          description: Освобождено либо уже expired/cancelled.
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс отсутствует или принадлежит другому клиенту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт ключа, attempt или состояния.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
  /v1/checks:
    post:
      operationId: uploadCheck
      summary: Загрузить дамп и критерии в зарезервированное место
      x-required-scopes:
      - checks:write
      responses:
        '202':
          description: Входы сохранены и check committed; повтор возвращает то же подтверждение.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckAccepted'
        '400':
          description: Некорректные параметры или JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс отсутствует или принадлежит другому клиенту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт ключа, attempt или состояния.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Резервация, артефакт или event payload истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: Превышен транспортный лимит; gateway может вернуть text/html.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Невалидный manifest, хеш, multipart или настройка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/UploadReservation'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                dump:
                  type: string
                  format: binary
                criteria:
                  type: string
                  format: binary
              required:
              - dump
              - criteria
            encoding:
              dump:
                contentType: application/octet-stream
              criteria:
                contentType: application/yaml, application/zip, application/octet-stream
      description: Проверка заголовков до чтения multipart. Размеры/хеши обязаны совпасть с manifest reservation.
        Нет очереди сверх reservation claims. 503 не означает, что ранее committed check потерян.
    get:
      operationId: listChecks
      summary: Сверить проверки конкретной сдачи
      x-required-scopes:
      - checks:read
      responses:
        '200':
          description: Keyset page своего клиента.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChecksPage'
        '400':
          description: Некорректные параметры или JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
      parameters:
      - name: submissionId
        in: query
        required: true
        schema: &id005
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$
      - name: attempt
        in: query
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: cursor
        in: query
        schema:
          type: string
          maxLength: 512
  /v1/checks/{checkId}:
    parameters:
    - $ref: '#/components/parameters/CheckId'
    get:
      operationId: getCheck
      summary: Получить состояние, оценку и доставку
      x-required-scopes:
      - checks:read
      responses:
        '200':
          description: Состояние check; scoring и delivery независимы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Check'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс отсутствует или принадлежит другому клиенту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Резервация, артефакт или event payload истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
  /v1/checks/{checkId}/artifacts/{kind}:
    parameters:
    - $ref: '#/components/parameters/CheckId'
    - name: kind
      in: path
      required: true
      schema:
        type: string
        enum: &id006
        - grading.json
        - result.json
        - report.html
        - execution-plans.json
        - runtime-evidence.json
    get:
      operationId: getArtifact
      summary: Скачать артефакт по фиксированному виду
      x-required-scopes:
      - checks:read
      responses:
        '200':
          description: Артефакт attachment. HTML имеет CSP sandbox; nosniff для всех видов.
          headers:
            Content-Disposition:
              schema:
                type: string
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                - nosniff
            Content-Security-Policy:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: string
                format: binary
            text/html:
              schema:
                type: string
                format: binary
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс отсутствует или принадлежит другому клиенту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Резервация, артефакт или event payload истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
  /v1/capacity:
    get:
      operationId: getCapacity
      summary: Получить снимок свободных мест
      x-required-scopes:
      - checks:read
      responses:
        '200':
          description: Снимок; reservation остаётся единственной атомарной гарантией места.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capacity'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
  /v1/admin/settings:
    get:
      operationId: getSettings
      summary: Получить текущие настройки и ETag
      x-required-scopes:
      - settings:read
      responses:
        '200':
          description: Динамические настройки из БД.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          headers: &id002
            ETag:
              description: Quoted revision, например "3".
              schema:
                type: string
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
    patch:
      operationId: patchSettings
      summary: Изменить cap или pause без перезапуска
      x-required-scopes:
      - settings:write
      responses:
        '200':
          description: Настройки сохранены, revision увеличен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Settings'
          headers: *id002
        '400':
          description: Некорректные параметры или JSON.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          description: If-Match не совпал с revision.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Невалидный manifest, хеш, multipart или настройка.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '428':
          description: If-Match обязателен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
      parameters:
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SettingsPatch'
      description: HardLimit сверяется с сервером. Снижение cap не прерывает live claims.
  /v1/admin/checks/{checkId}/delivery/retry:
    parameters:
    - $ref: '#/components/parameters/CheckId'
    post:
      operationId: retryDelivery
      summary: Повторно открыть доставку сохранённого события
      x-required-scopes:
      - delivery:retry
      responses:
        '202':
          description: Pending переоткрыт или уже pending/delivered; eventId/body сохранены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeliveryRetry'
        '401':
          description: Токен отсутствует или невалиден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Недостаточно scope или runMode запрещён.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Ресурс отсутствует или принадлежит другому клиенту.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Конфликт ключа, attempt или состояния.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: Резервация, артефакт или event payload истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Admission или зависимость временно недоступны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          headers: *id001
      description: Нет повторного исполнения check. Scope позволяет оператору retry любого клиента.
  /health/live:
    get:
      operationId: getLiveness
      summary: Живость HTTP-процесса
      x-required-scopes: []
      responses:
        '200':
          description: Готов/жив.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
  /health/ready:
    get:
      operationId: getReadiness
      summary: Готовность зависимостей
      x-required-scopes: []
      responses:
        '200':
          description: Готов/жив.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Не готов; без секретных деталей.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
      security: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque токен, clientId/scopes на сервере; не JWT студента.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Уникален в clientId/operation; повтор с другим manifest возвращает 409.
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[ -~]+$
    ReservationId:
      name: reservationId
      in: path
      required: true
      schema: &id003
        type: string
        format: uuid
    CheckId:
      name: checkId
      in: path
      required: true
      schema: *id003
    UploadReservation:
      name: X-Reservation-Id
      in: header
      required: true
      schema: *id003
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[1-9][0-9]*"$
  schemas:
    FileManifestDump:
      type: object
      additionalProperties: false
      properties:
        format:
          type: string
          enum:
          - xdump
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 25165824
        sha256: &id004
          type: string
          pattern: ^[0-9a-f]{64}$
      required:
      - format
      - sizeBytes
      - sha256
    FileManifestCriteria:
      type: object
      additionalProperties: false
      properties:
        format:
          type: string
          enum:
          - yaml
          - zip
        sizeBytes:
          type: integer
          minimum: 1
          maximum: 4194304
        sha256: *id004
      required:
      - format
      - sizeBytes
      - sha256
    ReservationRequest:
      type: object
      additionalProperties: false
      properties:
        submissionId: *id005
        attempt:
          type: integer
          minimum: 1
        studentId: *id005
        assignmentId: *id005
        criteriaVersion:
          type: string
          minLength: 1
          maxLength: 128
        projectName:
          type: string
          minLength: 1
          maxLength: 256
        runMode:
          type: string
          enum:
          - isolated
          - integration
          default: isolated
        dump:
          $ref: '#/components/schemas/FileManifestDump'
        criteria:
          $ref: '#/components/schemas/FileManifestCriteria'
      required:
      - submissionId
      - attempt
      - studentId
      - assignmentId
      - criteriaVersion
      - dump
      - criteria
      example:
        submissionId: submission-4815
        attempt: 1
        studentId: student-001
        assignmentId: demo
        criteriaVersion: 2026-10-14.1
        runMode: isolated
        dump:
          format: xdump
          sizeBytes: 20000000
          sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        criteria:
          format: yaml
          sizeBytes: 8000
          sha256: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
    Reservation:
      type: object
      additionalProperties: false
      properties:
        reservationId: *id003
        checkId: *id003
        status:
          type: string
          enum:
          - reserved
          - uploading
          - consumed
          - expired
          - cancelled
        expiresAt: &id007
          type: string
          format: date-time
        uploadDeadlineAt:
          type: string
          format: date-time
          nullable: true
        uploadUrl:
          type: string
          enum:
          - /v1/checks
      required:
      - reservationId
      - checkId
      - status
      - expiresAt
      - uploadDeadlineAt
      - uploadUrl
    CheckAccepted:
      type: object
      additionalProperties: false
      properties:
        checkId: *id003
        status:
          type: string
          enum:
          - accepted
        statusUrl:
          type: string
          example: /v1/checks/90566acb-77e0-45d6-835f-e74748e89fbe
      description: Повтор committed upload возвращает исходное подтверждение accepted, даже если работа уже завершена.
      required:
      - checkId
      - status
      - statusUrl
    CheckError:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          enum:
          - invalid_dump
          - invalid_criteria
          - unsupported_profile
          - engine_failure
