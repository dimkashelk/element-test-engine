[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "element-test-engine"
version = "0.1.0"
description = "Read-only structural testing of 1C:Element student projects"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
test = ["jsonschema>=4.18,<5"]
service = ["starlette>=1.8,<2", "uvicorn>=0.54,<1", "psycopg[binary]>=3.3.6,<4", "httpx>=0.28.1,<1", "python-multipart>=0.0.32,<1", "jsonschema>=4.18,<5"]

[tool.setuptools.packages.find]
include = ["element_test*", "element_check_service*"]

[tool.setuptools.package-data]
element_test = ["query_text.sbsl", "timer_queue.sbsl"]
element_check_service = ["migrations/*.sql"]
