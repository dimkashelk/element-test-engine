worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    map $request_id $error_request_id {
        "~^(?<id_a>[0-9a-f]{8})(?<id_b>[0-9a-f]{4})(?<id_c>[0-9a-f]{4})(?<id_d>[0-9a-f]{4})(?<id_e>[0-9a-f]{12})$" "$id_a-$id_b-$id_c-$id_d-$id_e";
        default "00000000-0000-0000-0000-000000000000";
    }

    # Не писать тело, Authorization, query string или значения критериев в лог.
    log_format transport '$remote_addr $request_method $uri $status '
                         '$request_time $request_length';
    access_log /dev/stdout transport;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 40m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 30s;
    server_tokens off;

    upstream autocheck_api {
        zone autocheck_api 64k;
        resolver 127.0.0.11 valid=5s ipv6=off;
        resolver_timeout 2s;
        server api:8000 resolve;
        keepalive 16;
    }

    server {
        listen 8080;

        error_page 400 = @json_400;
        location @json_400 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 400 '{"error":{"code":"invalid_request","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        error_page 404 = @json_404;
        location @json_404 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 404 '{"error":{"code":"invalid_request","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        error_page 405 = @json_405;
        location @json_405 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 405 '{"error":{"code":"invalid_request","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        error_page 408 = @json_408;
        location @json_408 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 408 '{"error":{"code":"invalid_request","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        error_page 413 = @json_413;
        location @json_413 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 413 '{"error":{"code":"payload_too_large","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        error_page 414 = @json_414;
        location @json_414 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 414 '{"error":{"code":"invalid_request","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        error_page 429 = @json_429;
        location @json_429 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            add_header Retry-After 5 always;
            return 429 '{"error":{"code":"capacity_full","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        error_page 500 = @json_500;
        location @json_500 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 500 '{"error":{"code":"dependency_unavailable","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        error_page 502 = @json_502;
        location @json_502 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 502 '{"error":{"code":"dependency_unavailable","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        error_page 503 = @json_503;
        location @json_503 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            add_header Retry-After 5 always;
            return 503 '{"error":{"code":"dependency_unavailable","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        error_page 504 = @json_504;
        location @json_504 {
            default_type application/json;
            add_header X-Request-Id $error_request_id always;
            add_header X-Content-Type-Options nosniff always;
            return 504 '{"error":{"code":"dependency_unavailable","message":"Gateway rejected request","requestId":"$error_request_id"}}';
        }

        location = /gateway-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /v1/checks {
            # API проверяет Authorization и X-Reservation-Id ДО multipart parsing.
            # Буферизация Nginx не должна сначала принимать весь дамп.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_send_timeout 200s;
            proxy_read_timeout 200s;
            proxy_pass http://autocheck_api;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_pass http://autocheck_api;
        }
    }
}
