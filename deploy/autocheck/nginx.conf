worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Не писать тело, Authorization, query string или значения критериев в лог.
    log_format transport '$remote_addr $request_method $uri $status '
                         '$request_time $request_length';
    access_log /dev/stdout transport;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    client_max_body_size 32m;
    client_body_timeout 30s;
    client_header_timeout 10s;
    send_timeout 30s;
    server_tokens off;

    upstream autocheck_api {
        server api:8000;
        keepalive 16;
    }

    server {
        listen 8080;

        location = /gateway-health {
            access_log off;
            default_type text/plain;
            return 200 'ok\n';
        }

        location = /v1/checks {
            # API проверяет Authorization и X-Reservation-Id ДО multipart parsing.
            # Буферизация Nginx не должна сначала принимать весь дамп.
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_send_timeout 200s;
            proxy_read_timeout 200s;
            proxy_pass http://autocheck_api;
        }

        location / {
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_connect_timeout 3s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_pass http://autocheck_api;
        }
    }
}
