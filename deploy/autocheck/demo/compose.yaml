x-observability: &observability
  restart: unless-stopped
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  migrate:
    pull_policy: never
  api:
    pull_policy: never
    scale: ${DEMO_API_REPLICAS:-3}
    mem_limit: 512m
    cpus: 0.75
  worker:
    pull_policy: never
    scale: ${DEMO_WORKER_REPLICAS:-2}
    mem_limit: 2g
    environment:
      ELEMENT_TEST_RUNTIME_TIMEOUT: 30s
  notifier:
    pull_policy: never
    networks: !override [backend]
    configs: !override
      - source: demo_notifier_config
        target: /etc/autocheck/service.yaml
  prometheus:
    <<: *observability
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --storage.tsdb.retention.size=1GB
      # Replica IPs change on recreation. Ignore samples from old IPs after four scrapes.
      - --query.lookback-delta=20s
    ports:
      - "127.0.0.1:${DEMO_PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./demo/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./demo/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - demo_prometheus:/prometheus
    secrets: [demo_metrics_token]
    networks: [backend, monitoring]
    depends_on: [blackbox, alertmanager]
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, 'http://127.0.0.1:9090/-/ready']
      interval: 5s
      timeout: 3s
      retries: 12

  blackbox:
    <<: *observability
    image: prom/blackbox-exporter:v0.28.0@sha256:e753ff9f3fc458d02cca5eddab5a77e1c175eee484a8925ac7d524f04366c2fc
    command: [--config.file=/etc/blackbox_exporter/config.yml]
    volumes:
      - ./demo/monitoring/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: [backend]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64

  alertmanager:
    <<: *observability
    image: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --cluster.listen-address=
    ports:
      - "127.0.0.1:${DEMO_ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./demo/monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - demo_alertmanager:/alertmanager
    networks: [monitoring]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, 'http://127.0.0.1:9093/-/ready']
      interval: 5s
      timeout: 3s
      retries: 12

  grafana:
    <<: *observability
    image: grafana/grafana:12.3.9@sha256:d4f671be4c5ff415ff9e9e8fd3439db00341ec537411fd8392646c9463d66a7f
    ports:
      - "127.0.0.1:${DEMO_GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/demo_grafana_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/autocheck.json
    volumes:
      - ./demo/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./demo/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - demo_grafana:/var/lib/grafana
    secrets: [demo_grafana_password]
    networks: [monitoring]
    depends_on:
      prometheus: {condition: service_healthy}
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      test: [CMD, wget, -qO, /dev/null, 'http://127.0.0.1:3000/api/health']
      interval: 5s
      timeout: 3s
      retries: 12

  k6:
    <<: *observability
    image: grafana/k6:1.4.2@sha256:3656673de3f30424e8ebcfa46acd9558d83b6a43612d0f668ffeac953950c6c7
    profiles: [load]
    restart: "no"
    command: [run, --no-usage-report, /scenario.js]
    environment:
      DEMO_LOAD_RATE: "${DEMO_LOAD_RATE:-15}"
      DEMO_LOAD_DURATION: "${DEMO_LOAD_DURATION:-45s}"
    volumes:
      - ./demo/load.js:/scenario.js:ro
    secrets: [demo_load_token]
    networks: [backend]
    mem_limit: 192m
    cpus: 0.75
    pids_limit: 128

networks:
  monitoring: {}

volumes:
  demo_prometheus: {}
  demo_alertmanager: {}
  demo_grafana: {}

configs:
  demo_notifier_config:
    file: ${DEMO_STATE_ROOT:-./demo/.state}/notifier.yaml

secrets:
  demo_metrics_token:
    file: ${DEMO_STATE_ROOT:-./demo/.state}/secrets/metrics_token
  demo_load_token:
    file: ${DEMO_STATE_ROOT:-./demo/.state}/secrets/load_token
  demo_grafana_password:
    file: ${DEMO_STATE_ROOT:-./demo/.state}/secrets/grafana_password
