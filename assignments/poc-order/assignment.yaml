name: Эксперимент №2 — Заказ.Товары
checks:
  - id: empty_rows
    type: runtime
    target: {module: ЗаказФормаОбъекта, method: РассчитатьИтоги}
    args: [[]]
    expected: {Строк: 0, Товаров: 0, Сумма: 0}
  - id: several_rows
    type: runtime
    target: {module: ЗаказФормаОбъекта, method: РассчитатьИтоги}
    args:
      - - {Количество: 2, Цена: 100, Сумма: 200}
        - {Количество: 3, Цена: 50, Сумма: 150}
    expected: {Строк: 2, Товаров: 5, Сумма: 350}
  - id: fractional_rows
    type: runtime
    target: {module: ЗаказФормаОбъекта, method: РассчитатьИтоги}
    args:
      - - {Количество: 0.5, Цена: 25, Сумма: 12.5}
        - {Количество: 1.25, Цена: 2, Сумма: 2.5}
        - {Количество: 0, Цена: 10, Сумма: 0}
    expected: {Строк: 3, Товаров: 1.75, Сумма: 15}
