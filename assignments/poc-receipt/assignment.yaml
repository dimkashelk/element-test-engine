name: 'Поступление на основании: оригинальный обработчик'
checks:
- id: receipt_empty
  type: runtime
  target:
    module: ПоступлениеТоваров.Объект
    method: ПриСозданииНаОсновании
  context:
    Склад:
      Идентификатор: old-warehouse
    Товары: []
  args:
  - Идентификатор: shipment-a
  mocks:
    objects:
      Отгрузка.Ссылка:
        shipment-a:
          Склад:
            Идентификатор: warehouse-a
          Товары: []
        shipment-b:
          Склад:
            Идентификатор: unused-warehouse
          Товары:
          - Номенклатура:
              Идентификатор: unused-product
            Количество: 99
            Цена: 99
            Сумма: 1
  observe:
  - Склад
  - Товары
  expected:
    Склад:
      Идентификатор: warehouse-a
    Товары: []
- id: receipt_one
  type: runtime
  target:
    module: ПоступлениеТоваров.Объект
    method: ПриСозданииНаОсновании
  context:
    Склад:
      Идентификатор: old-warehouse
    Товары: []
  args:
  - Идентификатор: shipment-a
  mocks:
    objects:
      Отгрузка.Ссылка:
        shipment-a:
          Склад:
            Идентификатор: warehouse-a
          Товары:
          - Номенклатура:
              Идентификатор: product-a
            Количество: 2
            Цена: 10
            Сумма: 23
        shipment-b:
          Склад:
            Идентификатор: unused-warehouse
          Товары:
          - Номенклатура:
              Идентификатор: unused-product
            Количество: 99
            Цена: 99
            Сумма: 1
  observe:
  - Склад
  - Товары
  expected:
    Склад:
      Идентификатор: warehouse-a
    Товары:
    - Номенклатура:
        Идентификатор: product-a
      Количество: 2
      Цена: 10
      Сумма: 23
