name: Эксперимент 1 — реальный метод из Движок.tar
checks:
  - id: fio_normal
    type: runtime
    target:
      module: ФизическиеЛица.Объект
      method: СформироватьФИО
    args: [Иванов, Иван, Иванович]
    expected: Иванов Иван Иванович
    failureExplanation: >-
      ФИО должно состоять из фамилии, имени и отчества в этом порядке,
      разделённых одним пробелом.
    points: 1
  - id: fio_trim
    type: runtime
    target:
      module: ФизическиеЛица.Объект
      method: СформироватьФИО
    args: [" Иванов ", " Иван ", " Иванович "]
    expected: Иванов Иван Иванович
    failureExplanation: >-
      Удалите пробелы в начале и конце каждой части ФИО перед объединением.
      Между фамилией, именем и отчеством должен оставаться один пробел.
    points: 1
  - id: fio_empty
    type: runtime
    target:
      module: ФизическиеЛица.Объект
      method: СформироватьФИО
    args: [" ", "", " "]
    expected: ""
    failureExplanation: >-
      Если все части ФИО пустые или содержат только пробелы,
      метод должен вернуть пустую строку.
    points: 1
