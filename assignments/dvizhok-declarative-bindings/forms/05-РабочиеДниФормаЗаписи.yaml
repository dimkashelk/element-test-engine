schemaVersion: 1
description: 'Базовый тип формы и владелец данных: ФормаЗаписиНабораКонстант<РабочиеДни.Запись>.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/0 указывает Обновить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОбычныеКоманды/Элементы/0 указывает Записать,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОсновнаяКоманда указывает ЗаписатьИЗакрыть,
  без запуска эффектов.

  Компонент Понедельник в указанной области: Значение показывает Запись.Понедельник.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Вторник в указанной области: Значение показывает Запись.Вторник. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Среда в указанной области: Значение показывает Запись.Среда. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Четверг в указанной области: Значение показывает Запись.Четверг. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Пятница в указанной области: Значение показывает Запись.Пятница. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Суббота в указанной области: Значение показывает Запись.Суббота. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Воскресенье в указанной области: Значение показывает Запись.Воскресенье.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Дополнительные компоненты разрешены. Имена обязательны только для явно названных
  компонентов. Порядок остальных компонентов свободный. Пути анонимных командных фрагментов
  явно закреплены указанными пунктами. Константы доступны только для чтения. Browser/native
  UI не оценивается.'
