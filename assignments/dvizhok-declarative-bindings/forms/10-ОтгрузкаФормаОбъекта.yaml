schemaVersion: 1
description: 'Базовый тип формы и владелец данных: ФормаОбъекта<Отгрузка.Объект>.

  Собственная команда в указанном фрагменте имеет совместимый обработчик без результата.

  Компонент Наследует в указанной области: Заголовок показывает ЗаголовокФормы. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/0 указывает Обновить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1/Элементы/0
  указывает СоздатьКопию, без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1/Элементы/1
  указывает СоздатьНаОсновании, без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1/Элементы/2
  указывает Удалить, без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1/Элементы/3
  указывает Восстановить, без запуска эффектов.

  Компонент Наследует/ДополнительныеКоманды/Элементы/1/Элементы/4 в указанной области:
  Представление показывает ПредставлениеРедактированиеДанных. Допускаются эквивалентные
  выражения.

  Тип требуемого компонента соответствует данным Строка.

  Связь команды в фрагменте Наследует/ОбычныеКоманды/Элементы/0 указывает Записать,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОсновнаяКоманда указывает ЗаписатьИЗакрыть,
  без запуска эффектов.

  Компонент Дата в указанной области: Доступность показывает РедактированиеДанных.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Дата в указанной области: Значение показывает Объект.Дата. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным ДатаВремя.

  Компонент Номер в указанной области: Доступность показывает РедактированиеДанных.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Номер в указанной области: Значение показывает Объект.Номер. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент Склад в указанной области: Значение показывает Объект.Склад. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Склады.Ссылка?.

  Компонент Товары в указанной области: Источник.Данные показывает Объект.Товары.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Массив<Отгрузка.Товары>.

  Компонент Товары_Номенклатура в указанной области: Значение показывает RowData.Номенклатура.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Номенклатура.Ссылка?.

  Компонент Товары_Количество в указанной области: Значение показывает RowData.Количество.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Число.

  Компонент Товары_Цена в указанной области: Значение показывает RowData.Цена. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Число.

  Компонент Товары_Сумма в указанной области: Значение показывает RowData.Сумма. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Число.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/3/Команды/Элементы/0
  указывает Компоненты.Товары.ДобавитьСтроку, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/3/КомандыНадОтмеченнымиСтроками/Элементы/0
  указывает Компоненты.Товары.ПереместитьСтрокуВверх, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/3/КомандыНадОтмеченнымиСтроками/Элементы/1
  указывает Компоненты.Товары.ПереместитьСтрокуВниз, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/3/КомандыНадОтмеченнымиСтроками/Элементы/2
  указывает Компоненты.Товары.Удалить, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/3/КомандыСтроки/Элементы/0
  указывает Компоненты.Товары.ПереместитьСтрокуВверх, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/3/КомандыСтроки/Элементы/1
  указывает Компоненты.Товары.ПереместитьСтрокуВниз, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/3/КомандыСтроки/Элементы/2
  указывает Компоненты.Товары.Удалить, без запуска эффектов.

  Компонент НадписьИтогиЧасти в указанной области: Видимость показывает СозданныйНаЧасти.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент НадписьИтогиЧасти в указанной области: Значение показывает ТекстИтоговЧасти.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Собственное свойство РедактированиеДанных имеет тип Булево и явно объявленные значения
  по умолчанию.

  Собственное свойство СозданныйНаЧасти имеет тип Булево и явно объявленные значения
  по умолчанию.

  Собственное свойство ТоварыТабличнаяЧасть имеет тип Массив<Отгрузка.Товары> и явно
  объявленные значения по умолчанию.

  Собственное свойство ПредставлениеРедактированиеДанных имеет тип Строка и явно объявленные
  значения по умолчанию.

  Собственное свойство ЗаголовокФормы имеет тип Строка и явно объявленные значения
  по умолчанию.

  Собственное свойство КоличествоВыбранныхСтрок имеет тип Число и явно объявленные
  значения по умолчанию.

  Собственное свойство КоличествоТоваров имеет тип Число и явно объявленные значения
  по умолчанию.

  Собственное свойство СуммаВыбранныхТоваров имеет тип Число и явно объявленные значения
  по умолчанию.

  Собственное свойство ТекстИтоговЧасти имеет тип Строка и явно объявленные значения
  по умолчанию.

  Дополнительные компоненты разрешены. Имена обязательны только для явно названных
  компонентов. Порядок остальных компонентов свободный. Пути анонимных командных фрагментов
  явно закреплены указанными пунктами. Константы доступны только для чтения. Browser/native
  UI не оценивается.'
