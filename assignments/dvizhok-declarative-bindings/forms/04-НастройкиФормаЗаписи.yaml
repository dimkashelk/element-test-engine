schemaVersion: 1
description: 'Базовый тип формы и владелец данных: ФормаЗаписиНабораКонстант<Настройки.Запись>.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/0 указывает Обновить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОбычныеКоманды/Элементы/0 указывает Записать,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОсновнаяКоманда указывает ЗаписатьИЗакрыть,
  без запуска эффектов.

  Компонент РазрешитьОтрицательныеОстатки в указанной области: Значение показывает
  Запись.РазрешитьОтрицательныеОстатки. Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент АвтоматическиАрхивироватьЗавершенныеПроцессы в указанной области: Значение
  показывает Запись.АвтоматическиАрхивироватьЗавершенныеПроцессы. Допускаются эквивалентные
  выражения.

  Тип требуемого компонента соответствует данным Булево.

  Дополнительные компоненты разрешены. Имена обязательны только для явно названных
  компонентов. Порядок остальных компонентов свободный. Пути анонимных командных фрагментов
  явно закреплены указанными пунктами. Константы доступны только для чтения. Browser/native
  UI не оценивается.'
clauses:
- id: form-04-000
  text: 'Базовый тип формы и владелец данных: ФормаЗаписиНабораКонстант<Настройки.Запись>.'
- id: form-04-001
  text: Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/0 указывает
    Обновить, без запуска эффектов.
- id: form-04-002
  text: Связь команды в фрагменте Наследует/ОбычныеКоманды/Элементы/0 указывает Записать,
    без запуска эффектов.
- id: form-04-003
  text: Связь команды в фрагменте Наследует/ОсновнаяКоманда указывает ЗаписатьИЗакрыть,
    без запуска эффектов.
- id: form-04-004
  text: 'Компонент РазрешитьОтрицательныеОстатки в указанной области: Значение показывает
    Запись.РазрешитьОтрицательныеОстатки. Допускаются эквивалентные выражения.'
- id: form-04-005
  text: Тип требуемого компонента соответствует данным Булево.
- id: form-04-006
  text: 'Компонент АвтоматическиАрхивироватьЗавершенныеПроцессы в указанной области:
    Значение показывает Запись.АвтоматическиАрхивироватьЗавершенныеПроцессы. Допускаются
    эквивалентные выражения.'
- id: form-04-007
  text: Тип требуемого компонента соответствует данным Булево.
form:
  name: НастройкиФормаЗаписи
  namespace: Администрирование
requirements:
- id: form-04-000
  clause: form-04-000
  kind: structure
  points: 1
  selector: {}
  assert:
    type: ФормаЗаписиНабораКонстант<Настройки.Запись>
- id: form-04-001
  clause: form-04-001
  kind: structure
  points: 1
  selector: {}
  assert:
    command:
      path:
      - Наследует
      - ДополнительныеКоманды
      - Элементы
      - '0'
      reference: =Обновить
