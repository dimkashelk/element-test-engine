schemaVersion: 1
description: 'Базовый тип формы и владелец данных: ФормаОбъекта<Склады.Объект>.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/0 указывает Обновить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1 указывает СоздатьКопию,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/2 указывает СоздатьНаОсновании,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/3 указывает Удалить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/4 указывает Восстановить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОбычныеКоманды/Элементы/0 указывает Записать,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОсновнаяКоманда указывает ЗаписатьИЗакрыть,
  без запуска эффектов.

  Компонент Наименование в указанной области: Значение показывает Объект.Наименование.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент АдресСклада в указанной области: Значение показывает Объект.АдресСклада.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Дополнительные компоненты разрешены. Имена обязательны только для явно названных
  компонентов. Порядок остальных компонентов свободный. Пути анонимных командных фрагментов
  явно закреплены указанными пунктами. Константы доступны только для чтения. Browser/native
  UI не оценивается.'
clauses:
- id: form-12-000
  text: 'Базовый тип формы и владелец данных: ФормаОбъекта<Склады.Объект>.'
- id: form-12-001
  text: Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/0 указывает
    Обновить, без запуска эффектов.
- id: form-12-002
  text: Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1 указывает
    СоздатьКопию, без запуска эффектов.
- id: form-12-003
  text: Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/2 указывает
    СоздатьНаОсновании, без запуска эффектов.
- id: form-12-004
  text: Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/3 указывает
    Удалить, без запуска эффектов.
- id: form-12-005
  text: Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/4 указывает
    Восстановить, без запуска эффектов.
- id: form-12-006
  text: Связь команды в фрагменте Наследует/ОбычныеКоманды/Элементы/0 указывает Записать,
    без запуска эффектов.
- id: form-12-007
  text: Связь команды в фрагменте Наследует/ОсновнаяКоманда указывает ЗаписатьИЗакрыть,
    без запуска эффектов.
- id: form-12-008
  text: 'Компонент Наименование в указанной области: Значение показывает Объект.Наименование.
    Допускаются эквивалентные выражения.'
- id: form-12-009
  text: Тип требуемого компонента соответствует данным Строка.
- id: form-12-010
  text: 'Компонент АдресСклада в указанной области: Значение показывает Объект.АдресСклада.
    Допускаются эквивалентные выражения.'
- id: form-12-011
  text: Тип требуемого компонента соответствует данным Строка.
