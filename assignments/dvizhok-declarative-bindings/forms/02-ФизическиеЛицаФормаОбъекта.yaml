schemaVersion: 1
description: 'Базовый тип формы и владелец данных: ФормаОбъекта<ФизическиеЛица.Объект>.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/0 указывает Обновить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1 указывает СоздатьКопию,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/2 указывает СоздатьНаОсновании,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/3 указывает Удалить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/4 указывает Восстановить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОбычныеКоманды/Элементы/0 указывает Записать,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОсновнаяКоманда указывает ЗаписатьИЗакрыть,
  без запуска эффектов.

  Компонент Фамилия в указанной области: Значение показывает Объект.Фамилия. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент Имя в указанной области: Значение показывает Объект.Имя. Допускаются эквивалентные
  выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент Отчество в указанной области: Значение показывает Объект.Отчество. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент ФлажокТелефонАктивен в указанной области: Значение показывает ТелефонАктивен.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Телефон в указанной области: Доступность показывает ТелефонАктивен. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Телефон в указанной области: Значение показывает Объект.Телефон. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент ФлажокПочтаАктивна в указанной области: Значение показывает ПочтаАктивна.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Почта в указанной области: Доступность показывает ПочтаАктивна. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Почта в указанной области: Значение показывает Объект.Почта. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Собственное свойство ТелефонАктивен имеет тип Булево и явно объявленные значения
  по умолчанию.

  Собственное свойство ПочтаАктивна имеет тип Булево и явно объявленные значения по
  умолчанию.

  Дополнительные компоненты разрешены. Имена обязательны только для явно названных
  компонентов. Порядок остальных компонентов свободный. Пути анонимных командных фрагментов
  явно закреплены указанными пунктами. Константы доступны только для чтения. Browser/native
  UI не оценивается.'
