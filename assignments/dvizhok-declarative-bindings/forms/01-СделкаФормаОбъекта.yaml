schemaVersion: 1
description: 'Базовый тип формы и владелец данных: ФормаОбъекта<Сделка.Объект>.

  Собственная команда в указанном фрагменте имеет совместимый обработчик без результата.

  Собственная команда в указанном фрагменте имеет совместимый обработчик без результата.

  Собственная команда в указанном фрагменте имеет совместимый обработчик без результата.

  Собственная команда в указанном фрагменте имеет совместимый обработчик без результата.

  Компонент Наследует в указанной области: Заголовок показывает ЗаголовокФормы. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/0 указывает Обновить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1/Элементы/0
  указывает СоздатьКопию, без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1/Элементы/1
  указывает СоздатьНаОсновании, без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1/Элементы/2
  указывает Удалить, без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1/Элементы/3
  указывает Восстановить, без запуска эффектов.

  Компонент Наследует/ДополнительныеКоманды/Элементы/1/Элементы/4 в указанной области:
  Представление показывает ПредставлениеРедактированиеДанных. Допускаются эквивалентные
  выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент Наследует/ДополнительныеКоманды/Элементы/1/Элементы/5 в указанной области:
  Представление показывает ПредставлениеАрхивирования. Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Связь команды в фрагменте Наследует/ОбычныеКоманды/Элементы/0 указывает Записать,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОсновнаяКоманда указывает ЗаписатьИЗакрыть,
  без запуска эффектов.

  Компонент Дата в указанной области: Доступность показывает РедактированиеДанных.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Дата в указанной области: Значение показывает Объект.Дата. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным ДатаВремя.

  Компонент Номер в указанной области: Доступность показывает РедактированиеДанных.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Номер в указанной области: Значение показывает Объект.Номер. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент Клиент в указанной области: Значение показывает Объект.Клиент. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Контрагенты.Ссылка?.

  Компонент Сумма в указанной области: Значение показывает Объект.Сумма. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Число.

  Компонент ДатаЗакрытия в указанной области: Значение показывает Объект.ДатаЗакрытия.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным ДатаВремя.

  Компонент Участники в указанной области: Источник.Данные показывает Объект.Участники.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Массив<Сделка.Участники>.

  Компонент Участники_ВыигралСделку в указанной области: Значение показывает RowData.ВыигралСделку.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент Участники_Партнер в указанной области: Значение показывает RowData.Партнер.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Контрагенты.Ссылка?.

  Компонент Участники_Комментарий в указанной области: Значение показывает RowData.Комментарий.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/0/Содержимое/Содержимое/0/Команды/Элементы/0
  указывает Компоненты.Участники.ДобавитьСтроку, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/0/Содержимое/Содержимое/0/КомандыНадОтмеченнымиСтроками/Элементы/0
  указывает Компоненты.Участники.ПереместитьСтрокуВверх, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/0/Содержимое/Содержимое/0/КомандыНадОтмеченнымиСтроками/Элементы/1
  указывает Компоненты.Участники.ПереместитьСтрокуВниз, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/0/Содержимое/Содержимое/0/КомандыНадОтмеченнымиСтроками/Элементы/2
  указывает Компоненты.Участники.Удалить, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/0/Содержимое/Содержимое/0/КомандыСтроки/Элементы/0
  указывает Компоненты.Участники.ПереместитьСтрокуВверх, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/0/Содержимое/Содержимое/0/КомандыСтроки/Элементы/1
  указывает Компоненты.Участники.ПереместитьСтрокуВниз, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/0/Содержимое/Содержимое/0/КомандыСтроки/Элементы/2
  указывает Компоненты.Участники.Удалить, без запуска эффектов.

  Компонент ПервичныйСпрос в указанной области: Источник.Данные показывает Объект.ПервичныйСпрос.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Массив<Сделка.ПервичныйСпрос>.

  Компонент ПервичныйСпрос_ОписаниеПотребностиКлиента в указанной области: Значение
  показывает RowData.ОписаниеПотребностиКлиента. Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент ПервичныйСпрос_Сумма в указанной области: Значение показывает RowData.Сумма.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Число.

  Компонент ПервичныйСпрос_ПроцентУдовлетворения в указанной области: Значение показывает
  RowData.ПроцентУдовлетворения. Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Число.

  Компонент ПервичныйСпрос_ПричинаНеудовлетворения в указанной области: Значение показывает
  RowData.ПричинаНеудовлетворения. Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент ПервичныйСпрос_Комментарий в указанной области: Значение показывает RowData.Комментарий.
