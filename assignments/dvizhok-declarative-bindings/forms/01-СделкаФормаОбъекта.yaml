  Тип требуемого компонента соответствует данным Строка.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/1/Содержимое/Содержимое/0/Команды/Элементы/0
  указывает Компоненты.ПервичныйСпрос.ДобавитьСтроку, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/1/Содержимое/Содержимое/0/КомандыНадОтмеченнымиСтроками/Элементы/0
  указывает Компоненты.ПервичныйСпрос.ПереместитьСтрокуВверх, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/1/Содержимое/Содержимое/0/КомандыНадОтмеченнымиСтроками/Элементы/1
  указывает Компоненты.ПервичныйСпрос.ПереместитьСтрокуВниз, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/1/Содержимое/Содержимое/0/КомандыНадОтмеченнымиСтроками/Элементы/2
  указывает Компоненты.ПервичныйСпрос.Удалить, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/1/Содержимое/Содержимое/0/КомандыСтроки/Элементы/0
  указывает Компоненты.ПервичныйСпрос.ПереместитьСтрокуВверх, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/1/Содержимое/Содержимое/0/КомандыСтроки/Элементы/1
  указывает Компоненты.ПервичныйСпрос.ПереместитьСтрокуВниз, без запуска эффектов.

  Связь команды в фрагменте Наследует/Содержимое/Содержимое/Содержимое/5/Страницы/1/Содержимое/Содержимое/0/КомандыСтроки/Элементы/2
  указывает Компоненты.ПервичныйСпрос.Удалить, без запуска эффектов.

  Компонент Архивный в указанной области: Значение показывает Объект.Архивный. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Булево.

  Компонент СтатусСделки в указанной области: Значение показывает Объект.СтатусСделки.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным СтатусСделки.

  Собственное свойство РедактированиеДанных имеет тип Булево и явно объявленные значения
  по умолчанию.

  Собственное свойство ПредставлениеРедактированиеДанных имеет тип Строка и явно объявленные
  значения по умолчанию.

  Собственное свойство ЗаголовокФормы имеет тип Строка и явно объявленные значения
  по умолчанию.

  Собственное свойство ПредставлениеАрхивирования имеет тип Строка и явно объявленные
  значения по умолчанию.

  Дополнительные компоненты разрешены. Имена обязательны только для явно названных
  компонентов. Порядок остальных компонентов свободный. Пути анонимных командных фрагментов
  явно закреплены указанными пунктами. Константы доступны только для чтения. Browser/native
  UI не оценивается.'
