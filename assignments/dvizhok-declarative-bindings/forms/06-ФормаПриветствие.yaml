description: 'Базовый тип формы и владелец данных: Форма.

  Встроенная форма РабочиеДниФормаЗаписи доступна только для чтения.

  Собственная команда в указанном фрагменте имеет совместимый обработчик без результата.

  Встроенная форма ДанныеКомпанииФормаЗаписи доступна только для чтения.

  Встроенная форма НастройкиФормаЗаписи доступна только для чтения.

  Компонент Наследует в указанной области: Заголовок показывает Приветствие. Допускаются
  эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Собственное свойство Приветствие имеет тип Строка и явно объявленные значения по
  умолчанию.

  Дополнительные компоненты разрешены. Имена обязательны только для явно названных
  компонентов. Порядок остальных компонентов свободный. Пути анонимных командных фрагментов
  явно закреплены указанными пунктами. Константы доступны только для чтения. Browser/native
  UI не оценивается.'
