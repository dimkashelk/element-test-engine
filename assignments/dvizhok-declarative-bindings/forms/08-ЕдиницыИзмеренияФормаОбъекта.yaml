schemaVersion: 1
description: 'Базовый тип формы и владелец данных: ФормаОбъекта<ЕдиницыИзмерения.Объект>.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/0 указывает Обновить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/1 указывает СоздатьКопию,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/2 указывает СоздатьНаОсновании,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/3 указывает Удалить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ДополнительныеКоманды/Элементы/4 указывает Восстановить,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОбычныеКоманды/Элементы/0 указывает Записать,
  без запуска эффектов.

  Связь команды в фрагменте Наследует/ОсновнаяКоманда указывает ЗаписатьИЗакрыть,
  без запуска эффектов.

  Компонент Наименование в указанной области: Значение показывает Объект.Наименование.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным Строка.

  Компонент ТипЕдиницыИзмерения в указанной области: Значение показывает Объект.ТипЕдиницыИзмерения.
  Допускаются эквивалентные выражения.

  Тип требуемого компонента соответствует данным ЕдиницаИзмеренияТип?.

  Дополнительные компоненты разрешены. Имена обязательны только для явно названных
  компонентов. Порядок остальных компонентов свободный. Пути анонимных командных фрагментов
  явно закреплены указанными пунктами. Константы доступны только для чтения. Browser/native
  UI не оценивается.'
