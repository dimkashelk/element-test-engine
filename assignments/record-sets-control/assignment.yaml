name: Контроль независимых исходов №32
checks:
- id: wrong-answer
  type: runtime
  points: 1
  comparison: record-sets-unordered
  target:
    module: Flow
    namespace: Entry
    method: Copy
  args:
  - base
  - target
  - 3
  storage:
    idType: Ууид
    registers:
    - Data::Prices
    initialRegisters:
    - type: Data::Prices
      filter:
        Key: base
        Region: EU
      rows:
      - Период: '2026-09-29'
        Key: base
        Region: EU
        Price: 2.5
        Factor: 10
        Link:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
      - Период: '2026-09-30'
        Key: base
        Region: EU
        Price: 4
        Factor: 1
        Link:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
