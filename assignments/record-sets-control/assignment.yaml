      value:
      - Период: '2026-09-29'
        Key: base
        Region: EU
        Price: 2.5
        Factor: 10
        Link:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
      - Период: '2026-09-30'
        Key: base
        Region: EU
        Price: 4
        Factor: 1
        Link:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
    - type: Data::Prices
      id: "{\n  \"Key\" : \"target\",\n  \"Region\" : \"EU\"\n}"
