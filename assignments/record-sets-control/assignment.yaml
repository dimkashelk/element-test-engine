      filter:
        Key: target
        Region: EU
      rows:
      - Период: '2025-01-01'
        Key: target
        Region: EU
        Price: 99
        Factor: 7
        Link: null
    - type: Data::Prices
      filter:
        Key: neighbor
        Region: US
      rows:
      - Период: '2026-09-29'
        Key: neighbor
        Region: US
        Price: 2.5
        Factor: 10
        Link:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
