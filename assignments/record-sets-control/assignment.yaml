        Key: neighbor
        Region: US
        Price: 4
        Factor: 1
        Link:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
  timeout: 15s
  trace: true
  expected:
    result: null
    storage:
    - type: Data::Prices
