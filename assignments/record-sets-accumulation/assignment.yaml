      id: "{\n  \"Регистратор\" : {\n    \"Идентификатор\" : \"33333333-1234-4234-8234-123456789abc\"\
        \n  }\n}"
      value:
      - Регистратор:
          Идентификатор: 33333333-1234-4234-8234-123456789abc
        Активность: true
        Период: '2026-09-29T12:30:15'
        ВидЗаписи: Расход
        Товар: A
        Количество: 7
        Стоимость: 10
      - Регистратор:
          Идентификатор: 33333333-1234-4234-8234-123456789abc
        Активность: true
        Период: '2026-09-30T15:00:00'
        ВидЗаписи: Приход
