name: Чтение наборов — accumulation
checks:
- id: copy
  type: runtime
  points: 1
  comparison: record-sets-unordered
  target:
    module: Поток
    namespace: Вход
    method: Перенести
  args:
  - Идентификатор: 12345678-1234-4234-8234-123456789abc
  - Идентификатор: abcdef12-1234-4234-8234-123456789abc
  - 3
  storage:
    idType: Ууид
    registers:
    - Учет::Движения
    initialRegisters:
    - type: Учет::Движения
      filter:
        Регистратор:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
      rows:
      - Регистратор:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
        Активность: true
        Период: '2026-09-29T12:30:15'
        ВидЗаписи: Расход
        Товар: A
        Количество: 2.5
        Стоимость: 10
      - Регистратор:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
        Активность: true
        Период: '2026-09-30T15:00:00'
        ВидЗаписи: Приход
        Товар: B
        Количество: 4
        Стоимость: 7
    - type: Учет::Движения
      filter:
        Регистратор:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
      rows:
      - Регистратор:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
        Активность: true
        Период: '2026-09-29T12:30:15'
        ВидЗаписи: Расход
        Товар: A
        Количество: 99
        Стоимость: 10
      - Регистратор:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
        Активность: true
        Период: '2026-09-30T15:00:00'
        ВидЗаписи: Приход
        Товар: B
        Количество: 4
        Стоимость: 7
    - type: Учет::Движения
      filter:
        Регистратор:
          Идентификатор: 33333333-1234-4234-8234-123456789abc
      rows:
      - Регистратор:
          Идентификатор: 33333333-1234-4234-8234-123456789abc
        Активность: true
        Период: '2026-09-29T12:30:15'
        ВидЗаписи: Расход
        Товар: A
        Количество: 7
        Стоимость: 10
      - Регистратор:
          Идентификатор: 33333333-1234-4234-8234-123456789abc
        Активность: true
        Период: '2026-09-30T15:00:00'
        ВидЗаписи: Приход
        Товар: B
        Количество: 4
        Стоимость: 7
  timeout: 15s
  trace: true
  expected:
    result: null
    storage:
    - type: Учет::Движения
      id: "{\n  \"Регистратор\" : {\n    \"Идентификатор\" : \"12345678-1234-4234-8234-123456789abc\"\
        \n  }\n}"
