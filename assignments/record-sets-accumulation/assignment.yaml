      - Регистратор:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
        Активность: true
        Период: '2026-09-29T12:30:15'
        ВидЗаписи: Расход
        Товар: A
        Количество: 2.5
        Стоимость: 10
      - Регистратор:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
        Активность: true
        Период: '2026-09-30T15:00:00'
        ВидЗаписи: Приход
        Товар: B
        Количество: 4
        Стоимость: 7
    - type: Учет::Движения
      id: "{\n  \"Регистратор\" : {\n    \"Идентификатор\" : \"abcdef12-1234-4234-8234-123456789abc\"\
        \n  }\n}"
