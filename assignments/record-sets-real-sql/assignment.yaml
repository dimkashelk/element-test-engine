name: Чтение наборов — real
checks:
- id: copy
  type: runtime
  points: 1
  comparison: record-sets-unordered
  target:
    module: КурсыВалют
    namespace: ПараметрыЗаписи
    method: Пересчитать
  args:
  - Идентификатор: abcdef12-1234-4234-8234-123456789abc
  storage:
    idType: Ууид
    registers:
    - ПараметрыЗаписи::КурсыВалют
    initial:
    - type: ПараметрыЗаписи::Валюты
      value:
        Ссылка:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
        Код: TGT
        Наименование: Целевая
        ОсновнаяВалюта:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
        Наценка: 3
    initialRegisters:
    - type: ПараметрыЗаписи::КурсыВалют
      filter:
        Валюта:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
      rows:
      - Период: '2026-09-29'
        Валюта:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
        Курс: 2.5
        Кратность: 10
      - Период: '2026-09-30'
        Валюта:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
        Курс: 4
        Кратность: 1
    - type: ПараметрыЗаписи::КурсыВалют
      filter:
        Валюта:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
      rows:
      - Период: '2025-01-01'
        Валюта:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
        Курс: 99
        Кратность: 7
    - type: ПараметрыЗаписи::КурсыВалют
      filter:
        Валюта:
          Идентификатор: 33333333-1234-4234-8234-123456789abc
      rows:
      - Период: '2026-09-30'
        Валюта:
          Идентификатор: 33333333-1234-4234-8234-123456789abc
        Курс: 8
        Кратность: 100
    backend: postgres
  timeout: 15s
  trace: true
  integration:
    backend: postgres
    operation: metadata-storage
  expected:
    result: null
    storage:
    - type: ПараметрыЗаписи::КурсыВалют
      id: "{\n  \"Валюта\" : {\n    \"Идентификатор\" : \"12345678-1234-4234-8234-123456789abc\"\
        \n  }\n}"
      value:
      - Период: '2026-09-29'
        Валюта:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
        Курс: 2.5
        Кратность: 10
      - Период: '2026-09-30'
        Валюта:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
        Курс: 4
        Кратность: 1
    - type: ПараметрыЗаписи::КурсыВалют
      id: "{\n  \"Валюта\" : {\n    \"Идентификатор\" : \"abcdef12-1234-4234-8234-123456789abc\"\
        \n  }\n}"
      value:
      - Период: '2026-09-29'
        Валюта:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
        Курс: 7.5
        Кратность: 10
      - Период: '2026-09-30'
        Валюта:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
        Курс: 12
        Кратность: 1
    - type: ПараметрыЗаписи::КурсыВалют
      id: "{\n  \"Валюта\" : {\n    \"Идентификатор\" : \"33333333-1234-4234-8234-123456789abc\"\
        \n  }\n}"
      value:
      - Период: '2026-09-30'
        Валюта:
          Идентификатор: 33333333-1234-4234-8234-123456789abc
        Курс: 8
        Кратность: 100
    - type: ПараметрыЗаписи::Валюты
      id: abcdef12-1234-4234-8234-123456789abc
      value:
        Ссылка:
          Идентификатор: abcdef12-1234-4234-8234-123456789abc
        Код: TGT
        Наименование: Целевая
        ОсновнаяВалюта:
          Идентификатор: 12345678-1234-4234-8234-123456789abc
        Наценка: 3
