- id: poc-platform_stock_sufficient
  type: runtime
  target:
    module: Отгрузка.Объект
    method: ПередЗаписью
  context:
    Товары:
    - Номенклатура:
        Идентификатор: product-1
      Количество: 5
  args:
  - {}
  - {}
  observe:
  - Товары
  mocks:
    queries:
    - text: "ВЫБРАТЬ\n    РегистрТовары.Номенклатура КАК Номенклатура,\n    РегистрТовары.КоличествоОстаток\
        \ КАК Количество\nИЗ\n    РегистрТовары.Остатки КАК РегистрТовары\nГДЕ\n \
        \   РегистрТовары.Номенклатура В (%{Товары.Преобразовать(Данные -> Данные.Номенклатура)})"
      fields:
        Номенклатура: Номенклатура.Ссылка?
        Количество: Число
      parameterType: Массив<Номенклатура.Ссылка?>
      rows:
      - Номенклатура:
          Идентификатор: product-1
        Количество: 7
  captureException: true
  expected:
    result:
      context:
        Товары:
        - Номенклатура:
            Идентификатор: product-1
          Количество: 5
          Цена: 0
          Сумма: 0
      calls:
      - owner: query0
        method: Создать
        args:
          Параметр:
          - Идентификатор: product-1
      - owner: query0
        method: Выполнить
        args: {}
    exception: null
  captureCalls: true
  points: 1.0
  properties: {}
  scenario: 'poc-platform: stock_sufficient'
  trace: true
