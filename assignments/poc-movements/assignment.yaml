name: 'Движения: оригинальный Отгрузка.ПослеЗаписи'
checks:
- id: movements_empty
  type: runtime
  target:
    module: Отгрузка.Объект
    method: ПослеЗаписи
  context:
    Ссылка:
      Идентификатор: shipment-1
    Склад:
      Идентификатор: warehouse-1
    Товары: []
  args:
  - {}
  - {}
  observe:
  - Ссылка
  - Дата
  - Склад
  mocks:
    registers:
    - РегистрТовары
  captureCalls: true
  expected:
    context:
      Ссылка:
        Идентификатор: shipment-1
      Дата: __runtimeDateTime__
      Склад:
        Идентификатор: warehouse-1
    calls:
    - owner: РегистрТовары
      method: Фильтр.Установить
      args:
        Регистратор:
          Идентификатор: shipment-1
    - owner: РегистрТовары
      method: Записать
      args:
        Замещать: true
  runtimeDateTime: Дата
