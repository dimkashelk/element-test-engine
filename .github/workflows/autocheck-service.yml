name: Autocheck service
on:
  push:
  pull_request:
jobs:
  service:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r deploy/autocheck/requirements.lock
      - run: python -m unittest tests.test_autocheck_service -v
        env:
          TEST_AUTOCHECK_DSN: postgresql://postgres:test-only@127.0.0.1:5432/postgres
      - run: docker compose --env-file deploy/autocheck/.env.example -f deploy/autocheck/compose.yaml config --quiet
      - name: Validate demo Compose configuration
        run: >-
          docker compose -p element-autocheck-demo --env-file deploy/autocheck/.env.example
          -f deploy/autocheck/compose.yaml -f deploy/autocheck/demo/compose.yaml
          --profile load config --quiet
