name: Nightly regression

on:
  schedule:
    # 23:17 UTC = 02:17 Europe/Moscow, following calendar day.
    - cron: '17 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    defaults:
      run:
        shell: bash
    env:
      ELEMENT_TEST_DOCKER_TESTS: '1'
      ELEMENT_TEST_INTEGRATION_TESTS: '1'
      ELEMENT_TEST_RUNTIME_TIMEOUT: '15s'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
        id: checkout
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Python dependencies
        run: python -m pip install -e .

      - name: Download runtime assets
        env:
          GH_TOKEN: ${{ github.token }}
          ASSETS_TAG: ${{ vars.CI_ASSETS_TAG || 'ci-assets-v1' }}
          ASSETS_SHA256: ${{ vars.CI_ASSETS_SHA256 }}
        run: |
          gh release download "$ASSETS_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern element-ci-assets.tar.gz --dir "$RUNNER_TEMP/element-ci-assets"
          python tools/ci/assets.py unpack \
            "$RUNNER_TEMP/element-ci-assets/element-ci-assets.tar.gz" \
            --sha256 "$ASSETS_SHA256"

      - name: Prepare Docker images and ephemeral SQL password
        run: |
          python - <<'PY'
          import json, os, secrets, subprocess
          from pathlib import Path
          runtime = json.loads(Path('config/runtimes.json').read_text())['9.0']
          database = json.loads(Path('config/integration.json').read_text())
          for image in (runtime['image'], database['image']):
              subprocess.run(['docker', 'pull', image], check=True, timeout=600)
          password = secrets.token_hex(24)
          print('::add-mask::' + password)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write('ELEMENT_TEST_INTEGRATION_PASSWORD=' + password + '\n')
          PY

      - name: Full regression
        id: tests
        timeout-minutes: 270
        run: |
          mkdir -p result/nightly
          python tools/ci/run_nightly.py 2>&1 | tee result/nightly/tests.log

      - name: Morning summary
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        env:
          NIGHTLY_JOB_STATUS: ${{ job.status }}
        run: python tools/ci/run_nightly.py --summary-only

      - name: Save reports and logs
        if: ${{ always() && steps.checkout.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ github.run_id }}-${{ github.run_attempt }}
          path: result/
          retention-days: 14
          if-no-files-found: error
