ВидЭлемента: КомпонентИнтерфейса
Ид: 46423be6-a209-4ef0-818f-c1bba3f1fcf4
Имя: ОтгрузкаФормаОбъекта
ОбластьВидимости: ВПроекте
Наследует:
    Тип: ФормаОбъекта<Отгрузка.Объект>
    ВключатьВАвтоИнтерфейс: Ложь
    Заголовок: =ЗаголовокФормы
    ДополнительныеКоманды:
        Тип: ФрагментКомандногоИнтерфейса
        Элементы:
            - =Обновить
            -
                Тип: ГруппаКомандногоИнтерфейса
                Важность: Обычная
                ВидОтображения: Подменю
                Видимость: Истина
                Доступность: Истина
                Изображение: МенюВертикальныеТочки.svg
                Элементы:
                    - =СоздатьКопию
                    - =СоздатьНаОсновании
                    - =Удалить
                    - =Восстановить
                    -
                        Тип: ОбычнаяКоманда
                        Обработчик: ПредставлениеРедактированиеДанныхОбработчик
                        Представление: =ПредставлениеРедактированиеДанных
    ОбычныеКоманды:
        Тип: ФрагментКомандногоИнтерфейса
        Элементы:
            - =Записать
    ОсновнаяКоманда: =ЗаписатьИЗакрыть
    Содержимое:
        Тип: ПроизвольныйШаблонФормы
        ШиринаВКолонках: Четверная
        Содержимое:
            Тип: Группа
            Имя: ГруппаПолей
            Содержимое:
                -
                    Тип: ПолеВвода<ДатаВремя>
                    Имя: Дата
                    Доступность: =РедактированиеДанных
                    Значение: =Объект.Дата
                -
                    Тип: ПолеВвода<Строка>
                    Имя: Номер
                    Доступность: =РедактированиеДанных
                    Значение: =Объект.Номер
                -
                    Тип: ПолеВвода<Склады.Ссылка?>
                    Имя: Склад
                    Значение: =Объект.Склад
                -
                    Тип: Таблица<ИсточникДанныхМассив<Отгрузка.Товары>>
                    Имя: Товары
                    ИспользоватьОтметкиСтрок: Истина
                    Источник:
                        Данные: '=СозданныйНаЧасти?ТоварыТабличнаяЧасть: Объект.Товары'
                    Колонки:
                        -
                            Тип: СтандартнаяКолонкаТаблицы<Отгрузка.Товары, Номенклатура.Ссылка?>
                            Имя: Товары_Номенклатура
                            Значение: =RowData.Номенклатура
                        -
                            Тип: СтандартнаяКолонкаТаблицы<Отгрузка.Товары, Число>
                            Имя: Товары_Количество
                            Значение: =RowData.Количество
                        -
                            Тип: СтандартнаяКолонкаТаблицы<Отгрузка.Товары, Число>
                            Имя: Товары_Цена
                            Значение: =RowData.Цена
                        -
                            Тип: СтандартнаяКолонкаТаблицы<Отгрузка.Товары, Число>
                            Имя: Товары_Сумма
                            Значение: =RowData.Сумма
                    Команды:
                        Тип: ФрагментКомандногоИнтерфейса
                        Элементы:
                            - =Компоненты.Товары.ДобавитьСтроку
                    КомандыНадОтмеченнымиСтроками:
                        Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<Массив<Отгрузка.Товары>>>
                        Элементы:
                            - =Компоненты.Товары.ПереместитьСтрокуВверх
                            - =Компоненты.Товары.ПереместитьСтрокуВниз
                            - =Компоненты.Товары.Удалить
                    КомандыСтроки:
                        Тип: ФрагментКомандногоИнтерфейса<КомандаСПараметром<Отгрузка.Товары>>
                        Элементы:
                            - =Компоненты.Товары.ПереместитьСтрокуВверх
                            - =Компоненты.Товары.ПереместитьСтрокуВниз
                            - =Компоненты.Товары.Удалить
                -
                    Тип: Надпись
                    Имя: НадписьИтогиЧасти
                    Видимость: =СозданныйНаЧасти
                    Значение: =ТекстИтоговЧасти
Свойства:
    -
        Имя: РедактированиеДанных
        Тип: Булево
        ЗначениеПоУмолчанию: Ложь
    -
        Имя: СозданныйНаЧасти
        Тип: Булево
        ЗначениеПоУмолчанию: Ложь
    -
        Имя: ТоварыТабличнаяЧасть
        Тип: Массив<Отгрузка.Товары>
    -
        Имя: ПредставлениеРедактированиеДанных
        Тип: Строка
        ЗначениеПоУмолчанию: Разрешить редактирование реквизитов
    -
        Имя: ЗаголовокФормы
        Тип: Строка
    -
        Имя: КоличествоВыбранныхСтрок
        Тип: Число
        ЗначениеПоУмолчанию: 0
    -
        Имя: КоличествоТоваров
        Тип: Число
        ЗначениеПоУмолчанию: 0
    -
        Имя: СуммаВыбранныхТоваров
        Тип: Число
        ЗначениеПоУмолчанию: 0
    -
        Имя: ТекстИтоговЧасти
        Тип: Строка
