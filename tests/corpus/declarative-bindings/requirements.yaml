schemaVersion: 1
description: Форма показывает название регистра и строки проводок. Обычный источник
  — строки документа. В режиме выбора показаны переданные строки. Колонка показывает
  дебет. Кнопки запрещены. Порядок колонок и имена компонентов свободны.
clauses:
- id: fields
  text: Название документа, без кнопок.
- id: rows
  text: Дебет строк выбранного источника с сохранением порядка и повторов.
form:
  name: Panel
  namespace: Alpha
requirements:
