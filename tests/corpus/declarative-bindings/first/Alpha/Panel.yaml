ВидЭлемента: КомпонентИнтерфейса
Имя: Panel
ОбластьВидимости: ВПроекте
Свойства:
- Имя: Selected
  Тип: Булево
- Имя: Supplied
  Тип: Массив<Book.Entries>
- Имя: Lost
  Тип: Массив<Book.Entries>
- Имя: Reordered
  Тип: Массив<Book.Entries>
- Имя: Duplicated
  Тип: Массив<Book.Entries>
Наследует:
  Тип: ФормаОбъекта<Book.Объект>
  Содержимое:
    Тип: Группа
    Содержимое:
    - Тип: ПолеВвода<Строка>
      Имя: LabelA
      Значение: =Объект.Caption
    - Тип: Таблица<ИсточникДанныхМассив<Book.Entries>>
      Имя: GridA
      Источник:
        Данные: '=Selected ? Supplied : Объект.Entries'
      Колонки:
      - Тип: СтандартнаяКолонкаТаблицы<Book.Entries, Число>
        Имя: AmountA
        Значение: =RowData.Debit
